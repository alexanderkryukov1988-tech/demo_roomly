[pytest]
testpaths = tests
addopts = -ra --browser chromium --tracing retain-on-failure --screenshot only-on-failure --output artifacts/browser --junitxml artifacts/junit.xml
markers =
    positive: позитивный сценарий бронирования с корректными данными
    negative: негативный сценарий, ожидается отказ в бронировании
